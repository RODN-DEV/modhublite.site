<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModHubLite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="loading-spinner" class="spinner-container">
        <div class="spinner"></div>
    </div>

    <main id="auth-page" class="auth-container" style="display: none;">
        <div class="auth-box">
            <div id="login-view">
                <h1>Welcome Back!</h1>
                <p class="welcome-animation">Enjoy full access to tools and videos.</p>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <button id="google-signin-btn" class="google-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Continue with Google
                </button>
                <p class="toggle-auth">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </div>

            <div id="signup-view" style="display: none;">
                <h1>Create Account</h1>
                <p class="caution-note">If not a developer or modder, sign up as a user.</p>
                <form id="signup-form">
                    <input type="text" id="signup-username" placeholder="Username" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <select id="signup-role" required>
                        <option value="user">Sign up as: User</option>
                        <option value="developer">Sign up as: Developer</option>
                    </select>
                    <button type="submit">Sign Up</button>
                </form>
                <p class="toggle-auth">Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
            
            <div class="support-area">
                <a href="https://wa.me/+256745430208" target="_blank" class="support-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M19.05 4.94A9.96 9.96 0 0 0 12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.85 0 3.59-.5 5.06-1.38l-1.01-1.01c-1.16.63-2.48 1-3.92 1.06L12 22c-5.52 0-10-4.48-10-10S6.48 2 12 2s10 4.48 10 10c0 1.44-.31 2.8-.88 4.03l-1.01-1.01C20.69 14.1 21 13.08 21 12c0-4.97-4.03-9-9-9s-9 4.03-9 9c0 4.97 4.02 9 9 9h.1z"/><path fill="currentColor" d="m16.5 7.51l-7.07 7.07l-2.12-2.12l-1.41 1.41L9.43 18l8.48-8.48z"/></svg>
                    WhatsApp
                </a>
                <a href="https://t.me/v2_0x1" target="_blank" class="support-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M9.78 18.65l.28-4.23l7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3L3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.58c-.28 1.13-1.04 1.4-1.74.88l-4.98-3.6-2.32 2.2a.83.83 0 0 1-.72.24z"/></svg>
                    Telegram
                </a>
            </div>
        </div>
    </main>

    <main id="dashboard-page" class="dashboard-container" style="display: none;">
        <header>
            <h2>ModHubLite Dashboard</h2>
            <div>
                <span id="user-email"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </header>

        <section id="upload-section" class="upload-box" style="display: none;">
            <h3>Upload New File</h3>
            <form id="upload-form">
                <input type="text" id="upload-title" placeholder="File Title" required>
                <textarea id="upload-description" placeholder="Description" required></textarea>
                <select id="upload-category" required>
                    <option value="Mod App">Mod App</option>
                    <option value="Video">Video</option>
                    <option value="Tool">Tool</option>
                </select>
                <label for="file-input">Select File:</label>
                <input type="file" id="file-input" required>
                <button type="submit">Upload</button>
            </form>
        </section>

        <section class="content-section">
            <h3>Mod Apps</h3>
            <div id="mod-apps-grid" class="grid"></div>
        </section>
        <section class="content-section">
            <h3>Videos</h3>
            <div id="videos-grid" class="grid"></div>
        </section>
        <section class="content-section">
            <h3>Modding Tools</h3>
            <div id="tools-grid" class="grid"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
